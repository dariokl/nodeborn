[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeborn"
version = "0.1.0"
description = "Persistent terminal-native colony simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.1.1",
    "pydantic>=2.12.5",
    "aiosqlite>=0.22.1",
    "rich>=14.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "hypothesis>=6.151.9",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
]

[project.scripts]
nodeborn = "nodeborn.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodeborn = ["ui/styles/*.tcss"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true